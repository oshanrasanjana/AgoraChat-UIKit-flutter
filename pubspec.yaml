name: agora_chat_uikit
description: A set of ui components adapted to the chat sdk can quickly build a chat page
  and chat through the chat sdk by invoking the ui components.
version: 1.1.0
homepage: https://www.agora.io/

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  image_picker: ^1.2.2
  file_picker: ^12.3.0
  record: ^7.0.0
  audioplayers: ^6.7.1
  agora_chat_sdk: ^1.3.3
  path_provider: ^2.1.5
  win32: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ease.em_chat_uikit
        pluginClass: FlutterChatUikitPlugin
      ios:
        pluginClass: FlutterChatUikitPlugin

  # To add assets to your plugin package, add an assets section, like this:
  assets:
    - images/
 

